<div id="radio-player-transition" aria-label="Singapore Radio player transition">
  <style>
    #radio-player-transition { --radio-paper:#fffefa; --radio-ink:#101820; --radio-muted:#56616b; --radio-green:#07583f; --radio-red:#b7352d; --radio-edge:#b3bdb8; --radio-sage:#edf4ee; color:var(--radio-ink); font-family:Arial,sans-serif; width:100%; }
    #radio-player-transition * { box-sizing:border-box; }
    #radio-player-transition .radio-screen { position:relative; isolation:isolate; overflow:hidden; width:100%; max-width:411px; margin:0 auto; background:var(--radio-paper); border:1px solid var(--radio-edge); border-radius:14px; }
    #radio-player-transition button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; }
    #radio-player-transition button:focus-visible { outline:3px solid #699883; outline-offset:3px; }
    #radio-player-transition svg { width:24px!important; height:24px!important; flex-shrink:0; }
    #radio-player-transition .radio-browser { padding:16px; min-height:746px; display:flex; flex-direction:column; }
    #radio-player-transition .radio-header { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; margin-bottom:22px; }
    #radio-player-transition .radio-title { font-size:23px; font-weight:500; margin:0; }
    #radio-player-transition .radio-language { display:flex; align-items:center; gap:6px; font-size:16px; padding:10px 8px; border:1px solid var(--radio-edge); border-radius:8px; flex-shrink:0; }
    #radio-player-transition .radio-language svg { width:19px!important; height:19px!important; }
    #radio-player-transition .radio-filter { border:1px solid var(--radio-edge); border-radius:8px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    #radio-player-transition .radio-filter small { display:block; font-size:15px; color:var(--radio-muted); margin-bottom:3px; }
    #radio-player-transition .radio-filter strong { font-size:19px; font-weight:500; }
    #radio-player-transition .radio-search { padding:15px 12px; display:flex; align-items:center; gap:12px; border:1px solid var(--radio-edge); border-radius:8px; color:var(--radio-muted); font-size:18px; }
    #radio-player-transition .radio-tabs { display:flex; border-bottom:1px solid var(--radio-edge); margin:16px 0; font-size:20px; font-weight:500; }
    #radio-player-transition .radio-tabs span { flex:1; text-align:center; padding:14px 4px; }
    #radio-player-transition .radio-tabs .chosen { color:var(--radio-green); border-bottom:3px solid var(--radio-green); }
    #radio-player-transition .radio-count { margin:0 0 14px; color:var(--radio-muted); font-size:16px; }
    #radio-player-transition .radio-station { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 0; }
    #radio-player-transition .radio-station-art { width:54px; height:54px; object-fit:contain; border-radius:8px; background:#fff; }
    #radio-player-transition .radio-station-art.yes { background:var(--radio-ink); }
    #radio-player-transition .radio-identity { flex:1; min-width:120px; }
    #radio-player-transition .radio-name { margin:0 0 5px; font-size:21px; font-weight:500; }
    #radio-player-transition .radio-detail { margin:0; font-size:16px; color:var(--radio-muted); }
    #radio-player-transition .radio-row-actions { display:flex; align-items:center; justify-content:flex-end; width:100%; gap:12px; }
    #radio-player-transition .radio-heart { width:48px; height:48px; display:grid; place-items:center; color:var(--radio-green); }
    #radio-player-transition .radio-heart[aria-pressed="true"] svg { fill:var(--radio-green); }
    #radio-player-transition .radio-row-play { display:flex; align-items:center; justify-content:center; gap:6px; min-width:104px; min-height:48px; padding:10px 14px; border-radius:8px; background:var(--radio-green); color:white; font-size:18px; font-weight:500; }
    #radio-player-transition .radio-row-play svg { width:18px!important; height:18px!important; fill:currentColor; }
    #radio-player-transition .radio-mini { display:flex; align-items:center; padding:10px; margin-top:auto; gap:10px; background:rgba(228,238,230,.92); border:1px solid #9fbeac; border-radius:8px; min-height:80px; }
    #radio-player-transition .radio-open { display:flex; align-items:center; flex:1; min-width:0; gap:10px; text-align:left; padding:0; min-height:56px; }
    #radio-player-transition .radio-open img { width:48px; height:48px; }
    #radio-player-transition .radio-open-copy { flex:1; min-width:0; }
    #radio-player-transition .radio-open-copy strong { display:block; font-size:18px; font-weight:500; margin-bottom:3px; }
    #radio-player-transition .radio-open-copy span { font-size:15px; color:var(--radio-green); }
    #radio-player-transition .radio-open .radio-chevron { width:18px!important; height:18px!important; color:var(--radio-green); }
    #radio-player-transition .radio-divider { height:40px; width:1px; background:#aac7b4; flex-shrink:0; }
    #radio-player-transition .radio-toggle { background:var(--radio-red); color:#fff; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
    #radio-player-transition .radio-toggle svg { fill:currentColor; stroke-width:0; }
    #radio-player-transition .radio-mini-toggle { width:56px; height:56px; }
    #radio-player-transition .radio-mini-toggle svg { width:32px!important; height:32px!important; }
    #radio-player-transition .radio-player { position:absolute; inset:0; z-index:2; background:var(--radio-paper); padding:16px 16px 24px; display:flex; flex-direction:column; align-items:center; visibility:hidden; }
    #radio-player-transition .radio-player .radio-header { width:100%; margin-bottom:18px; }
    #radio-player-transition .radio-back { display:flex; gap:8px; align-items:center; padding:0; min-height:48px; text-align:left; font-size:16px; font-weight:500; }
    #radio-player-transition .radio-back svg { width:20px!important; height:20px!important; }
    #radio-player-transition .radio-player-heading { align-self:stretch; color:var(--radio-muted); font-size:18px; margin:0 0 18px; }
    #radio-player-transition .radio-art-space { display:grid; place-items:center; width:200px; height:200px; flex-shrink:0; }
    #radio-player-transition .radio-main-art { width:150px; height:150px; border-radius:28px; object-fit:contain; }
    #radio-player-transition .radio-player-name { font-size:32px; font-weight:500; margin:14px 0 10px; text-align:center; }
    #radio-player-transition .radio-player-detail { color:var(--radio-muted); font-size:19px; margin:0 0 18px; }
    #radio-player-transition .radio-status { font-size:19px; font-weight:500; color:var(--radio-green); margin:0 0 18px; }
    #radio-player-transition .radio-save { display:flex; align-items:center; gap:8px; border:1px solid var(--radio-edge); border-radius:10px; padding:11px 16px; font-size:18px; min-height:48px; }
    #radio-player-transition .radio-save svg { color:var(--radio-green); }
    #radio-player-transition .radio-controls { display:flex; align-items:center; justify-content:space-around; width:100%; gap:12px; margin-top:24px; }
    #radio-player-transition .radio-control { display:flex; flex-direction:column; align-items:center; gap:10px; font-size:17px; }
    #radio-player-transition .radio-skip { width:60px; height:60px; border-radius:50%; background:var(--radio-sage); color:var(--radio-green); display:grid; place-items:center; }
    #radio-player-transition .radio-skip svg { width:30px!important; height:30px!important; fill:currentColor; }
    #radio-player-transition .radio-full-toggle { width:96px; height:96px; }
    #radio-player-transition .radio-full-toggle svg { width:44px!important; height:44px!important; }
    #radio-player-transition .radio-toggle-label { font-size:21px; font-weight:500; }
    #radio-player-transition .radio-queue { font-size:16px; color:var(--radio-muted); margin:24px 0 0; }
    #radio-player-transition .radio-sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    @media(max-width:360px) {
      #radio-player-transition .radio-title { font-size:20px; }
      #radio-player-transition .radio-browser,#radio-player-transition .radio-player { padding-left:12px; padding-right:12px; }
      #radio-player-transition .radio-language { padding:10px 6px; gap:4px; }
      #radio-player-transition .radio-open { gap:8px; }
      #radio-player-transition .radio-mini { gap:8px; }
      #radio-player-transition .radio-header { gap:6px; }
      #radio-player-transition .radio-search { font-size:16px; gap:8px; }
    }
  </style>

AAAAASUVORK5CYII='];
      const stations = [{name:'YES 933',frequency:'93.3 FM',background:'#101820'}, {name:'LOVE 972',frequency:'97.2 FM',background:'#ffffff'}];
      const saved = [true,true];
      let selected = 0, playing = true, expanded = false, animation = null, transitionId = 0;
      root.querySelectorAll('[data-logo]').forEach(image => { image.src = logos[Number(image.dataset.logo)]; });

      function icons() { if (globalThis.lucide) lucide.createIcons(); }
      function render() {
        const station = stations[selected];
        root.querySelector('.radio-mini-name').textContent = station.name;
        root.querySelector('.radio-player-name').textContent = station.name;
        root.querySelector('.radio-player-detail').textContent = station.frequency + ' · Mandarin';
        for (const image of root.querySelectorAll('.radio-mini-art,.radio-main-art')) {
          image.src = logos[selected]; image.style.background = station.background;
        }
        root.querySelector('.radio-main-art').alt = station.name;
        root.querySelector('.radio-status').textContent = playing ? '● LIVE' : 'Stopped';
        root.querySelector('.radio-toggle-label').textContent = playing ? 'Stop' : 'Play';
        root.querySelector('.radio-queue').textContent = 'Favourites · ' + (selected + 1) + ' of 2';
        open.setAttribute('aria-label','Open ' + station.name + ' radio controls');
        for (const button of root.querySelectorAll('.radio-toggle')) {
          button.style.background = playing ? '#b7352d' : '#07583f';
          button.setAttribute('aria-label',(playing ? 'Stop ' : 'Play ') + station.name);
          button.innerHTML = '<i data-lucide="' + (playing ? 'square' : 'play') + '" aria-hidden="true"></i>';
        }
        for (const row of root.querySelectorAll('.radio-station')) {
          const index = Number(row.dataset.station);
          const heart = row.querySelector('.radio-heart');
          heart.setAttribute('aria-pressed',String(saved[index]));
          heart.setAttribute('aria-label',(saved[index] ? 'Remove ' : 'Save ') + stations[index].name + (saved[index] ? ' from favourites' : ' to favourites'));
          const rowPlay = row.querySelector('.radio-row-play');
          rowPlay.innerHTML = selected === index && playing ? 'Playing' : '<i data-lucide="play" aria-hidden="true"></i>Play';
        }
        const save = root.querySelector('.radio-save');
        save.setAttribute('aria-pressed',String(saved[selected]));
        save.querySelector('span').textContent = saved[selected] ? 'Saved' : 'Save';
        icons();
      }

      function showPlayer(show) {
        if (show === expanded && !animation) return;
        const current = getComputedStyle(player);
        const ongoing = animation ? {opacity:current.opacity,transform:current.transform} : null;
        if (animation) { animation.cancel(); animation = null; }
        const id = ++transitionId;
        expanded = show;
        const reduced = options.reducedMotion || preference.matches;
        const movement = options.motion === 'Gentle rise' ? 'translateY(32px)' : 'translateY(0)';
        const visible = {opacity:1,transform:'translateY(0)'};
        const hidden = {opacity:0,transform:movement};
        const frames = show ? [ongoing || hidden,visible] : [ongoing || visible,hidden];
        player.style.visibility = 'visible';
        player.inert = !show;
        browser.inert = show;
        open.setAttribute('aria-expanded',String(show));
        player.setAttribute('aria-hidden',String(!show));
        if (show) back.focus({preventScroll:true}); else open.focus({preventScroll:true});
        const done = () => {
          if (id !== transitionId) return;
          player.style.visibility = show ? 'visible' : 'hidden';
          player.style.opacity = show ? '1' : '0';
          player.style.transform = 'none';
          if (animation) { animation.cancel(); animation = null; }
          root.querySelector('.radio-announcement').textContent = show ? 'Focus Player opened' : 'Station browser opened';
        };
        if (reduced) { done(); return; }
        animation = player.animate(frames,{duration:show ? options.duration : Math.round(options.duration * .8), easing:'cubic-bezier(.2,0,0,1)',fill:'both'});
        animation.onfinish = done;
      }

      open.addEventListener('click',() => showPlayer(true));
      back.addEventListener('click',() => showPlayer(false));
      root.addEventListener('keydown',event => { if(event.key === 'Escape' && expanded) { event.preventDefault(); showPlayer(false); } });
      root.querySelectorAll('.radio-toggle').forEach(button => button.addEventListener('click',() => { playing = !playing; render(); }));
      root.querySelectorAll('.radio-station').forEach(row => {
        const index = Number(row.dataset.station);
        row.querySelector('.radio-row-play').addEventListener('click',() => { selected=index; playing=true; render(); showPlayer(true); });
        row.querySelector('.radio-heart').addEventListener('click',() => { saved[index]=!saved[index]; render(); });
      });
      root.querySelector('.radio-save').addEventListener('click',() => { saved[selected]=!saved[selected]; render(); });
      for(const selector of ['.radio-previous','.radio-next']) root.querySelector(selector).addEventListener('click',() => { selected=1-selected; playing=true; render(); });
      preference.addEventListener('change',() => { if(animation && preference.matches) showPlayer(expanded); });
      render();
      if(globalThis.Tweak) {
        const tweak = new Tweak({container:root,onChange:() => { if(animation) showPlayer(expanded); }});
        tweak.addSelect(options,'motion',{label:'Transition',options:['Gentle rise','Fade only']});
        tweak.addSlider(options,'duration',{label:'Opening duration',min:180,max:400,step:20,unit:'ms'});
        tweak.addToggle(options,'reducedMotion',{label:'Reduced motion'});
      }
    })();
  </script>
